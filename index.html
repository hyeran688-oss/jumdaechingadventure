<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>점대칭 탐험대 - 최종 랭킹</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --blue: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
      --yellow: #facc15;
      --purple: #7c3aed;
      --text: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 50%, #fefce8 100%);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--blue);
      color: white;
      padding: 12px 16px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 800;
    }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 10px;
    }

    .panel {
      background: white;
      border-radius: 16px;
      border: 2px solid #dbeafe;
      padding: 14px;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
      margin-bottom: 10px;
    }

    .login-panel {
      border-color: #bfdbfe;
      max-width: 420px;
      margin: 60px auto;
      text-align: center;
    }

    .login-title {
      font-weight: 900;
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: var(--blue);
    }

    .login-guide {
      font-size: 0.95rem;
      margin-bottom: 14px;
      color: #374151;
      line-height: 1.5;
    }

    .login-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    input {
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #d1d5db;
      font-size: 1rem;
      width: 100%;
      max-width: 300px;
      text-align: center;
    }

    input:focus {
      outline: none;
      border-color: var(--blue);
    }

    .game-bar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    @media (min-width: 720px) {
      .game-bar {
        grid-template-columns: 1.2fr 1fr 1fr 1fr 1fr;
      }
    }

    .stat-card {
      background: white;
      border: 2px solid #bfdbfe;
      border-radius: 12px;
      padding: 6px 8px;
      text-align: center;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.12);
    }

    .stat-label {
      font-size: 0.78rem;
      color: #4b5563;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 1.05rem;
      font-weight: 800;
    }

    .question-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }

    .question-title {
      font-weight: 800;
      font-size: 1rem;
    }

    .chip {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1e3a8a;
      font-size: 0.8rem;
      font-weight: 700;
      margin-left: 4px;
    }

    .stage-chip {
      background: #fef3c7;
      color: #92400e;
    }

    .mission-box {
      border-radius: 12px;
      border: 2px dashed #a78bfa;
      background: #faf5ff;
      padding: 8px;
      margin-bottom: 6px;
    }

    .mission-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #5b21b6;
      margin-bottom: 4px;
    }

    .mission-target {
      font-size: 1.05rem;
      font-weight: 900;
      color: #111827;
      background: white;
      border-radius: 10px;
      padding: 6px 8px;
      margin: 4px 0;
      border: 2px solid #ddd6fe;
      text-align: center;
    }

    .small-text {
      font-size: 0.85rem;
      color: #4b5563;
      line-height: 1.4;
    }

    .progress-wrap {
      margin-top: 4px;
      background: #e5e7eb;
      border-radius: 999px;
      height: 12px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #84cc16);
      transition: width 0.25s;
    }

    .star-row {
      font-size: 1.2rem;
      letter-spacing: 2px;
      text-align: center;
      margin-top: 4px;
    }

    .canvas-box {
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      background: #f8fafc;
      padding: 6px;
      text-align: center;
    }

    canvas {
      max-width: 100%;
      height: auto;
      background: white;
      border-radius: 10px;
      touch-action: manipulation;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      background: #e5e7eb;
      color: #111827;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-blue {
      background: var(--blue);
      color: white;
    }

    .btn-green {
      background: var(--green);
      color: white;
    }

    .btn-red {
      background: var(--red);
      color: white;
    }

    .btn-purple {
      background: var(--purple);
      color: white;
    }

    .selected {
      outline: 3px solid var(--yellow);
      filter: brightness(1.05);
    }

    .feedback {
      margin-top: 6px;
      border-radius: 12px;
      padding: 8px;
      min-height: 46px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .feedback.good {
      background: #ecfdf5;
      border-color: #bbf7d0;
    }

    .feedback.bad {
      background: #fef2f2;
      border-color: #fecaca;
    }

    .ranking-title {
      font-weight: 900;
      font-size: 1.1rem;
      margin-bottom: 10px;
      text-align: center;
      color: var(--green);
    }

    .ranking-list {
      margin: 0;
      padding-left: 0;
      list-style: none;
      line-height: 1.8;
      font-size: 0.92rem;
      max-height: 420px;
      overflow-y: auto;
    }

    .ranking-list li {
      padding: 6px 10px;
      border-bottom: 1px solid #e5e7eb;
    }

    .ranking-list li:nth-child(1) {
      background: #fef3c7;
      font-weight: 800;
    }

    .ranking-list li:nth-child(2) {
      background: #f3f4f6;
      font-weight: 700;
    }

    .ranking-list li:nth-child(3) {
      background: #fff7ed;
      font-weight: 700;
    }

    .pulse {
      animation: pulse 0.45s ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .confetti-text {
      font-weight: 900;
      color: #15803d;
    }

    .hidden {
      display: none !important;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .overlay-content {
      background: white;
      border-radius: 16px;
      padding: 20px;
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
  </style>
</head>

<body>
<header>
  점대칭 탐험대: 중심과 대응점 미션
</header>

<main>
  <section id="loginBox" class="panel login-panel">
    <div class="login-title">점대칭 탐험대</div>
    <div class="login-guide">
      아래에 자신을 식별할 수 있는 닉네임을 입력하세요.<br />
      입력한 닉네임은 마지막 랭킹에 표시됩니다.
    </div>
    <div class="login-row">
      <input id="nicknameInput" maxlength="20" placeholder="예: 지우, 민준, 5-2 12번" />
      <button id="btnStartLogin" class="btn-blue">시작하기</button>
    </div>
  </section>

  <div id="gameArea" class="hidden">
    <section class="game-bar">
      <div class="stat-card">
        <div class="stat-label">현재 문제</div>
        <div class="stat-value" id="statQuestion">1 / 50</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">점수</div>
        <div class="stat-value" id="statScore">0점</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">콤보</div>
        <div class="stat-value" id="statCombo">0 COMBO</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">하트</div>
        <div class="stat-value" id="statHearts">♥ ♥ ♥</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">소요 시간</div>
        <div class="stat-value" id="statTime">0초</div>
      </div>
    </section>

    <section class="panel">
      <div class="question-head">
        <div class="question-title">이 도형은 점대칭도형일까요?</div>
        <div>
          <span class="chip" id="shapeName">도형 이름</span>
          <span class="chip stage-chip" id="stageLabel">판별 미션</span>
        </div>
      </div>

      <div class="mission-box">
        <div class="mission-title">대응점 미션</div>
        <div class="small-text" id="missionGuide">
          점대칭도형이라고 확인되면, 여기에서 대응점을 차례대로 찾는 미션이 열립니다.
        </div>
        <div class="mission-target" id="missionTarget">아직 미션 없음</div>
        <div class="progress-wrap">
          <div class="progress-bar" id="missionProgress"></div>
        </div>
        <div class="star-row" id="starRow">☆ ☆ ☆</div>
      </div>

      <div class="canvas-box">
        <canvas id="canvas" width="460" height="460"></canvas>
      </div>

      <div class="button-row">
        <button id="btnSym" class="btn-blue">점대칭도형이다</button>
        <button id="btnNotSym" class="btn-red">점대칭도형이 아니다</button>
        <button id="btnCheck" class="btn-purple">정답 확인</button>
        <button id="btnNext" class="btn-green" disabled>다음 문제</button>
      </div>

      <div class="feedback" id="feedback">
        이 도형이 점대칭도형인지 아닌지 먼저 선택하고, [정답 확인]을 눌러 보세요.
      </div>
    </section>
  </div>

  <div id="rankingOverlay" class="overlay hidden">
    <div class="overlay-content">
      <div class="ranking-title">최종 랭킹</div>
      <ol id="rankingList" class="ranking-list">
        <li>랭킹을 불러오는 중입니다.</li>
      </ol>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
  import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp,
    collection,
    query,
    orderBy,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDa7P7_Go3h4vl9ffdJ_QF91NHioKZ3El4",
    authDomain: "class57-4f8f1.firebaseapp.com",
    databaseURL: "https://class57-4f8f1-default-rtdb.firebaseio.com",
    projectId: "class57-4f8f1",
    storageBucket: "class57-4f8f1.firebasestorage.app",
    messagingSenderId: "606009192919",
    appId: "1:606009192919:web:39a06b4b6229c70da89b92",
    measurementId: "G-2HL14C0BLY"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const ROOM_ID = "central_symmetry_today";

  let currentUser = null;
  let currentNickname = "익명학생";
  let rankingData = [];

  async function startFirebaseLogin(nickname) {
    currentNickname = nickname || "익명학생";

    try {
      await signInAnonymously(auth);
      return true;
    } catch (error) {
      console.error("익명 로그인 실패:", error);
      alert("Firebase 익명 로그인에 실패했습니다. Firebase 콘솔에서 Anonymous 로그인이 켜져 있는지 확인해 주세요.");
      return false;
    }
  }

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      watchRanking();
    }
  });

  async function saveScoreToFirebase(finalScore, totalQuestions, correctCount, wrongCount, maxCombo, elapsedSeconds, completed, solvedCount) {
    if (!currentUser) {
      console.warn("아직 로그인되지 않아 점수를 저장하지 못했습니다.");
      return;
    }

    const scoreRef = doc(db, "rankings", ROOM_ID, "scores", currentUser.uid);

    await setDoc(scoreRef, {
      nickname: currentNickname,
      score: finalScore,
      totalQuestions: totalQuestions,
      solvedCount: solvedCount,
      correctCount: correctCount,
      wrongCount: wrongCount,
      maxCombo: maxCombo,
      elapsedSeconds: elapsedSeconds,
      completed: completed,
      updatedAt: serverTimestamp()
    }, { merge: true });
  }

  function watchRanking() {
    const q = query(
      collection(db, "rankings", ROOM_ID, "scores"),
      orderBy("score", "desc")
    );

    onSnapshot(q, (snapshot) => {
      rankingData = [];
      snapshot.forEach((docSnap) => {
        rankingData.push(docSnap.data());
      });
    });
  }

  window.startFirebaseLogin = startFirebaseLogin;
  window.saveScoreToFirebase = saveScoreToFirebase;
  window.getRankingData = () => rankingData;
</script>

  function pointToCanvas(x, y) {
    const pad = 40;
    const scale = (canvas.width - pad * 2) / 8;
    return {
      x: canvas.width / 2 + x * scale,
      y: canvas.height / 2 - y * scale
    };
  }

  function rotatePoint([x, y], center, angle) {
    const [cx, cy] = center;
    const dx = x - cx;
    const dy = y - cy;
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    return [
      cx + dx * cos - dy * sin,
      cy + dx * sin + dy * cos
    ];
  }

  function getPoints(shape, angle = 0) {
    const result = {};
    for (const label of shape.order) {
      result[label] = rotatePoint(shape.points[label], shape.center, angle);
    }
    return result;
  }

  function drawPolygon(shape, angle, fill, stroke, lineWidth) {
    const pts = getPoints(shape, angle);
    ctx.save();
    ctx.beginPath();
    shape.order.forEach((label, i) => {
      const [x, y] = pts[label];
      const p = pointToCanvas(x, y);
      if (i === 0) {
        ctx.moveTo(p.x, p.y);
      } else {
        ctx.lineTo(p.x, p.y);
      }
    });
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineWidth;
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawFoundPairs(shape) {
    ctx.save();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#16a34a";
    foundPairs.forEach(pair => {
      const [a, b] = pair;
      const p1 = pointToCanvas(...shape.points[a]);
      const p2 = pointToCanvas(...shape.points[b]);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();

      const c = pointToCanvas(...shape.center);
      ctx.beginPath();
      ctx.arc(c.x, c.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = "#16a34a";
      ctx.fill();
    });
    ctx.restore();
  }

  function drawLabels(shape, selectedPoint, wrongPoint) {
    ctx.save();
    ctx.font = "bold 14px system-ui";

    for (const label of shape.order) {
      const [x, y] = shape.points[label];
      const p = pointToCanvas(x, y);

      let color = "#111827";
      let fill = "#ffffff";

      if (label === selectedPoint) {
        fill = "#fde68a";
      }

      if (label === wrongPoint) {
        fill = "#fecaca";
        color = "#991b1b";
      }

      const isFound = foundPairs.some(pair => pair.includes(label));
      if (isFound) {
        fill = "#bbf7d0";
        color = "#14532d";
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();

      const textW = ctx.measureText(label).width;
      ctx.fillStyle = color;
      ctx.fillText(label, p.x - textW / 2, p.y - 10);
    }

    ctx.restore();
  }

  function draw(shape, angle = 0, options = {}) {
    const { showRotatedOverlay = false, selectedPoint = null, wrongPoint = null } = options;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.strokeStyle = "#e5e7eb";
    ctx.lineWidth = 1;

    for (let v = -4; v <= 4; v++) {
      const p1 = pointToCanvas(v, -4);
      const p2 = pointToCanvas(v, 4);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();

      const q1 = pointToCanvas(-4, v);
      const q2 = pointToCanvas(4, v);
      ctx.beginPath();
      ctx.moveTo(q1.x, q1.y);
      ctx.lineTo(q2.x, q2.y);
      ctx.stroke();
    }

    ctx.restore();

    const c = pointToCanvas(current.center[0], current.center[1]);

    ctx.save();
    ctx.fillStyle = "#2563eb";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#1e3a8a";
    ctx.font = "bold 14px system-ui";
    ctx.fillText("O", c.x + 8, c.y - 6);
    ctx.restore();

    drawPolygon(shape, 0, "#dbeafe", "#1d4ed8", 3);
    drawFoundPairs(shape);

    if (angle !== 0) {
      drawPolygon(shape, angle, "rgba(250, 204, 21, 0.35)", "#f97316", 3);
    }

    if (showRotatedOverlay) {
      drawPolygon(shape, Math.PI, "rgba(250, 204, 21, 0.28)", "#f97316", 3);
    }

    drawLabels(shape, selectedPoint, wrongPoint);
  }

  function getElapsedSeconds() {
    if (!totalStartTime) {
      return 0;

    return Math.round((Date.now() - totalStartTime) / 1000);

  function startTimer() {

  function getTimeBonus() {
    if (!questionStartTime) {
      return 10;
    }

    const elapsed = (Date.now() - questionStartTime) / 1000;

    if (elapsed <= 5) return 100;
    if (elapsed <= 10) return 70;
    if (elapsed <= 20) return 40;
    return 10;
  }

    if (index < allShapes.length - 1) {
      index++;
      loadQuestion();
    } else {
      await showFinalResult();
    }
  });

  function animateRotation(callback) {
    const duration = 850;
    const start = performance.now();

    function frame(now) {
      const t = Math.min(1, (now - start) / duration);
      const angle = Math.PI * t;

      draw(current, angle);

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        draw(current, 0, { showRotatedOverlay: true });
        if (callback) {
          callback();
        }
      }
    }

    requestAnimationFrame(frame);
  }

  function judgeAnswer() {
    if (selectedAnswer === current.isSym) {
      const timeBonus = getTimeBonus();

      addScore(100 + timeBonus + combo * 10);
      combo++;
      correctCount++;
      updateMaxCombo();

      feedback.className = "feedback good pulse";

      if (current.isSym) {
        feedback.innerHTML =
          `<span class="confetti-text">정답입니다!</span><br>
          이 도형은 점대칭도형입니다. 이제 대응점 미션을 모두 해결해야 다음 문제로 갈 수 있습니다.`;

        startMission();
      } else {
        feedback.innerHTML =
          `<span class="confetti-text">정답입니다!</span><br>
          이 도형은 점대칭도형이 아닙니다. [다음 문제]를 눌러 계속 진행하세요.`;

        stage = "done";
        btnNext.disabled = false;
        starRow.textContent = combo >= 3 ? "★ ★ ★" : "★ ★ ☆";
      }
    } else {
      combo = 0;
      hearts = Math.max(0, hearts - 1);

      penalty(30);
      wrongCount++;

      feedback.className = "feedback bad";

      if (current.isSym) {
        feedback.innerHTML =
          `아쉽지만 이 도형은 사실 점대칭도형입니다.<br>
          대응점 미션을 통해 더 정확히 확인해 봅시다.`;

        startMission();
      } else {
        feedback.innerHTML =
          `아쉽지만 이 도형은 점대칭도형이 아닙니다.<br>
          [다음 문제]를 눌러 계속 진행하세요.`;

        stage = "done";
        btnNext.disabled = false;
        starRow.textContent = "★ ☆ ☆";
      }

      if (hearts === 0) {
        hearts = 3;
      }
    }

    updateStats();
  }

  function startMission() {
    if (!current.isSym || !current.pairs || current.pairs.length === 0) {
      stage = "done";
      btnNext.disabled = false;
      return;
    }

    stage = "mission";
    stageLabel.textContent = "대응점 미션";

    missionList = current.pairs.map(pair => ({ from: pair[0], to: pair[1] }));
    missionList = shuffle(missionList);
    missionIndex = 0;
    foundPairs = [];

    missionGuide.innerHTML =
      "중심 O를 사이에 두고 점들을 마주 보게 짝지어야 합니다.<br>" +
      "표시된 점의 <b>대응점</b>을 도형 위에서 직접 눌러 보세요.";

    setMission();
    btnNext.disabled = true;
  }

  function setMission() {
    if (missionIndex >= missionList.length) {
      completeMission();
      return;
    }

    currentTarget = missionList[missionIndex].from;
    currentAnswer = missionList[missionIndex].to;

    missionTarget.textContent = `${currentTarget}의 대응점을 눌러라!`;
    missionProgress.style.width = `${(missionIndex / missionList.length) * 100}%`;

    draw(current, 0, { selectedPoint: currentTarget });
  }

  function completeMission() {
    stage = "done";

    addScore(100);
    combo++;
    updateMaxCombo();

    missionTarget.textContent = "대응점 미션 완료!";
    missionGuide.innerHTML =
      `<b>성공!</b> 대응점들을 모두 찾았습니다. 이제 [다음 문제]로 넘어갈 수 있습니다.`;

    missionProgress.style.width = "100%";
    starRow.textContent = combo >= 4 ? "★ ★ ★" : "★ ★ ☆";

    feedback.className = "feedback good pulse";
    feedback.innerHTML =
      `<span class="confetti-text">미션 클리어!</span><br>
      이 도형의 대응점을 모두 표시했습니다.`;

    btnNext.disabled = false;

    draw(current);
  }

  canvas.addEventListener("click", (e) => {
    if (stage !== "mission") return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    const clicked = findClickedPoint(x, y);
    if (!clicked) return;

    if (clicked === currentAnswer) {
      addScore(20);
      combo++;
      correctCount++;
      updateMaxCombo();

      foundPairs.push([currentTarget, currentAnswer]);
      missionIndex++;

      feedback.className = "feedback good";
      feedback.textContent = `좋아요! ${currentTarget}와 ${currentAnswer}는 대응점입니다.`;

      setMission();
    } else {
      penalty(10);
      combo = 0;
      wrongCount++;

      feedback.className = "feedback bad";
      feedback.textContent =
        `아직 아니에요. ${currentTarget}에서 중심 O를 지나 같은 거리만큼 반대편으로 가 보세요.`;

      draw(current, 0, { selectedPoint: currentTarget, wrongPoint: clicked });
    }

    updateStats();
  });

  function findClickedPoint(px, py) {
    let nearest = null;
    let nearestDist = Infinity;

    for (const label of current.order) {
      const p = pointToCanvas(...current.points[label]);
      const d = Math.hypot(px - p.x, py - p.y);

      if (d < nearestDist) {
        nearestDist = d;
        nearest = label;
      }
    }

    if (nearestDist <= 25) {
      return nearest;
    }

    return null;
  }
</script>
